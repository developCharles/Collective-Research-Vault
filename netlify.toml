# Netlify build configuration for the CORE-V React client.
# If the site's "Base directory" is already set to "client" in the Netlify UI,
# this file is still safe to keep: Netlify merges these settings.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. client/public/_redirects also ships this rule with the build,
# so routing keeps working even if this file is not picked up.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
